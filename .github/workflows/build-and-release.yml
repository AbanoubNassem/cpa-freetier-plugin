name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-linux-windows:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            os: linux
            arch: amd64
            ext: so
            cc: gcc
          - target: linux_arm64
            os: linux
            arch: arm64
            ext: so
            cc: aarch64-linux-gnu-gcc
          - target: windows_amd64
            os: windows
            arch: amd64
            ext: dll
            cc: x86_64-w64-mingw32-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 zip

      - name: Determine Tag and Version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Compile Shared Library
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p build/${{ matrix.target }}
          go build -buildmode=c-shared -ldflags="-s -w" -o build/${{ matrix.target }}/cpa-freetier-plugin.${{ matrix.ext }} main.go
          sed 's/"entrypoint": "cpa-freetier-plugin.so"/"entrypoint": "cpa-freetier-plugin.${{ matrix.ext }}"/' plugin.json > build/${{ matrix.target }}/cpa-freetier-plugin.json

      - name: Package Release Archives
        run: |
          VER="${{ steps.tag.outputs.version }}"
          mkdir -p dist
          cd build/${{ matrix.target }}
          zip ../../dist/cpa-freetier-plugin_${{ matrix.target }}.zip cpa-freetier-plugin.${{ matrix.ext }} cpa-freetier-plugin.json
          zip ../../dist/cpa-freetier-plugin_${VER}_${{ matrix.target }}.zip cpa-freetier-plugin.${{ matrix.ext }} cpa-freetier-plugin.json
          cd ../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 1

  build-darwin:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin_arm64
            arch: arm64
            cflags: "-arch arm64"
          - target: darwin_amd64
            arch: amd64
            cflags: "-arch x86_64"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Determine Tag and Version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Compile Shared Library
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_CFLAGS: ${{ matrix.cflags }}
          CGO_LDFLAGS: ${{ matrix.cflags }}
        run: |
          mkdir -p build/${{ matrix.target }}
          go build -buildmode=c-shared -ldflags="-s -w" -o build/${{ matrix.target }}/cpa-freetier-plugin.dylib main.go
          cp build/${{ matrix.target }}/cpa-freetier-plugin.dylib build/${{ matrix.target }}/cpa-freetier-plugin.so
          sed 's/"entrypoint": "cpa-freetier-plugin.so"/"entrypoint": "cpa-freetier-plugin.dylib"/' plugin.json > build/${{ matrix.target }}/cpa-freetier-plugin.json

      - name: Package Release Archives
        run: |
          VER="${{ steps.tag.outputs.version }}"
          mkdir -p dist
          cd build/${{ matrix.target }}
          zip ../../dist/cpa-freetier-plugin_${{ matrix.target }}.zip cpa-freetier-plugin.dylib cpa-freetier-plugin.so cpa-freetier-plugin.json
          zip ../../dist/cpa-freetier-plugin_${VER}_${{ matrix.target }}.zip cpa-freetier-plugin.dylib cpa-freetier-plugin.so cpa-freetier-plugin.json
          cd ../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 1

  release:
    name: Publish Full-Platform Release
    needs: [build-linux-windows, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag and Version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
